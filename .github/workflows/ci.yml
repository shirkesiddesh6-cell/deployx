
name: DeployX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check backend syntax
        working-directory: ./backend
        run: node --check server.js

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      - name: Create dummy .env for CI validation
        run: |
          cat > .env <<EOF
          POSTGRES_DB=deployx
          POSTGRES_USER=deployx
          POSTGRES_PASSWORD=deployx_ci_dummy
          EOF

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -t deployx-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t deployx-frontend:test ./frontend

      - name: Build nginx Docker image
        run: docker build -t deployx-nginx:test ./nginx

      - name: CI passed
        run: echo "All checks passed"
