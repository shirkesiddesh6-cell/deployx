services:

  postgres:
    restart: unless-stopped
    image: postgres:18
    container_name: deployx-postgres
    environment:
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - deployx-postgres-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployx_user -d deployx"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build: ./backend
    container_name: deployx-backend
    env_file:
    - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build: ./frontend
    container_name: deployx-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  nginx:
    restart: unless-stopped
    build: ./nginx
    container_name: deployx-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:

  deployx-postgres-data:
