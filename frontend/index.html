<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeployX Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DeployX</h1>
        <p>Application Deployment & Monitoring Platform</p>
    </header>

    <main>

        <section class="dashboard">

            <h2>Deployment Dashboard</h2>

            <div class="stats">

                <div class="stat-card">
                    <h3>Total Deployments</h3>
                    <p id="totalDeployments">0</p>
                </div>

                <div class="stat-card">
                    <h3>Successful</h3>
                    <p id="successfulDeployments">0</p>
                </div>

                <div class="stat-card">
                    <h3>Failed</h3>
                    <p id="failedDeployments">0</p>
                </div>

            </div>

        </section>


        <section class="status-section">

            <h2>Platform Status</h2>

            <button onclick="showStatus()">
                Check Platform Status
            </button>

            <p id="status"></p>

        </section>


        <section class="deployment-section">

            <h2>Deployments</h2>

            <h3>Create Deployment</h3>

            <input
                type="text"
                id="applicationName"
                placeholder="Application Name"
            >

            <input
                type="text"
                id="environment"
                placeholder="Environment"
            >

            <select id="deploymentStatus">
    <option value="">Select Status</option>
    <option value="RUNNING">RUNNING</option>
    <option value="SUCCESS">SUCCESS</option>
    <option value="FAILED">FAILED</option>
            </select>


            <button onclick="createDeployment()">
                Create Deployment
            </button>

            <hr>

            <button onclick="loadDeployments()">
                Load Deployments
            </button>

            <div id="deployments"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
