<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>DeployX</h1>
        <p>Application Deployment & Monitoring Platform</p>
    </header>

    <main>
        <h2>Welcome to DeployX</h2>
        <p>Build. Deploy. Monitor.</p>

        <button onclick="showStatus()">Check Platform Status</button>

        <p id="status"></p>

        <hr>

     <h2>Deployments</h2>

<h3>Create Deployment</h3>

<input type="text" id="applicationName" placeholder="Application Name">

<input type="text" id="environment" placeholder="Environment">

<input type="text" id="deploymentStatus" placeholder="Status">

<button onclick="createDeployment()">Create Deployment</button>

<hr>

<button onclick="loadDeployments()">Load Deployments</button>   

        <div id="deployments"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
