apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-backend
  template:
    metadata:
      labels:
        app: deployx-backend
    spec:
      containers:
        - name: backend
          image: deployx-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: deployx
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: deployx-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: deployx-backend
spec:
  selector:
    app: deployx-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
