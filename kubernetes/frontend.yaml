apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-frontend
  template:
    metadata:
      labels:
        app: deployx-frontend
    spec:
      containers:
        - name: frontend
          image: deployx-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: deployx-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
