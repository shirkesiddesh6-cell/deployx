apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-nginx
  template:
    metadata:
      labels:
        app: deployx-nginx
    spec:
      containers:
        - name: nginx
          image: deployx-nginx:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: deployx-nginx
spec:
  selector:
    app: deployx-nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
